[package]
name = "canonforge"
version = "0.2.1"
edition = "2024"
rust-version = "1.91.1"
description = "Backend-neutral evidence compiler for heterogeneous sources"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yazanabuashour/canonforge"
repository = "https://github.com/yazanabuashour/canonforge"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
libc = "0.2"
mail-parser = { version = "0.11", features = ["encoding_rs"] }
jsonschema = { version = "0.49", default-features = false, features = ["arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[lints.rust]
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_duration_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
strip = true
lto = "thin"
