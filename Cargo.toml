[package]
name = "canonforge"
version = "0.4.1"
edition = "2024"
rust-version = "1.97.1"
description = "Backend-neutral evidence compiler for heterogeneous sources"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yazanabuashour/canonforge"
repository = "https://github.com/yazanabuashour/canonforge"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
libc = "0.2"
mail-parser = { version = "0.11", features = ["encoding_rs"] }
jsonschema = { version = "0.49", default-features = false, features = ["arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[lints.rust]
let_underscore_drop = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
default_union_representation = "deny"
disallowed_types = "deny"
empty_drop = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
host_endian_bytes = "deny"
ignore_without_reason = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pointer_format = "deny"
precedence_bits = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
too_many_lines = "deny"
try_err = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
strip = true
lto = "thin"
