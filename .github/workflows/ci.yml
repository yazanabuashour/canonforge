name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.revision == '' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 2026-07-09
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt
      - run: scripts/ci.sh
